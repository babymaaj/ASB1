name: windows-build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch VST3 SDK
        shell: bash
        run: git clone --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build (also runs the Steinberg validator post-build)
        run: cmake --build build --config Release 2>&1 | Tee-Object -FilePath build-log.txt
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath test-log.txt
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp -r build/VST3/Release/ASIOStreamBridge.vst3 out/ || true
          cp build/bin/Release/asb_probe.exe out/ 2>/dev/null || cp build/Release/asb_probe.exe out/ || true
          cp build-log.txt test-log.txt out/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ASIOStreamBridge-win64, path: out }
